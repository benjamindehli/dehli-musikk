name: Build and Deploy
permissions:
  contents: read

on:
  release:
    types: [created]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Build
        run: yarn build
      # Reads the exported HTML, so it has to run after the build and before the
      # artifact goes anywhere. Fails the release rather than shipping markup
      # that points at files which are not there.
      - name: Verify Markup Assets
        run: yarn verify:markup
      # Same reasoning: the markdown twins only exist once the exporter has run,
      # and a page that loses its twin is invisible from the site itself.
      - name: Verify Markdown
        run: yarn verify:markdown
      - name: Archive Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: out
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: out
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
