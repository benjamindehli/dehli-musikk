name: Build and Deploy
permissions:
  contents: read

on:
  release:
    types: [created]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Build
        run: yarn build
      # Reads the exported HTML, so it has to run after the build and before the
      # artifact goes anywhere. Fails the release rather than shipping markup
      # that points at files which are not there.
      - name: Verify Markup Assets
        run: yarn verify:markup
      # Same reasoning: the markdown twins only exist once the exporter has run,
      # and a page that loses its twin is invisible from the site itself.
      - name: Verify Markdown
        run: yarn verify:markdown
      # No build output involved: this is the edge Worker's negotiation logic,
      # which decides whether a request gets HTML or markdown. A false positive
      # would serve plain text to a browser, so it gates the release too.
      - name: Test Worker
        run: yarn worker:test
      - name: Archive Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: out
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # At job level so the step below can test it in an `if`, which cannot read a
    # secret directly.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: out
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      # Deploys after hosting, so the markdown files the Worker serves are
      # already in place. Skipped when no Cloudflare token is configured: the
      # Worker is an enhancement, and a missing secret should not fail a release
      # that has already shipped the site.
      #
      # Invoked through npx rather than cloudflare/wrangler-action, which infers
      # a package manager from the lockfile: it picked yarn, and the global yarn
      # on the runner is 1.22 while this repo declares yarn 4 via packageManager,
      # so it refused to run without Corepack. The major version is pinned
      # because that action also defaulted to wrangler 3.90, which is older than
      # wrangler.jsonc support and cannot read this Worker's config at all.
      # wrangler reads CLOUDFLARE_API_TOKEN from the environment.
      - name: Deploy Markdown Negotiation Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy --config worker/wrangler.jsonc
