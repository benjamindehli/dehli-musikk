name: Build and Deploy
permissions:
  contents: read

on:
  release:
    types: [created]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies
        run: yarn install --immutable
      # Reads public/ rather than the export, so it runs before the build and
      # fails fast. Catches a SKILL.md edited without regenerating the digest in
      # the discovery index, which would otherwise ship an index telling every
      # reader the document had been tampered with.
      - name: Verify Agent Skills Index
        run: yarn verify:skills
      # Also source-only, so it runs before the build for the same reason. The
      # gallery renders whatever the manifest describes and quietly skips the
      # rest, so a product whose screenshots were added without running
      # `yarn images:products` would otherwise ship a page that looks untouched
      # and never says why.
      - name: Verify Product Gallery Images
        run: yarn verify:images
      - name: Build
        run: yarn build
        env:
          # Not a secret: the beacon token identifies the site, is served in the
          # HTML of every page by design, and says nothing about a visitor. A
          # repository variable rather than a repository secret, so it stays
          # readable in the logs and in the dashboard. An empty value builds a
          # site with no beacon at all rather than failing, which is what forks
          # and local builds want.
          NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_ANALYTICS_TOKEN }}
      # Reads the exported HTML, so it has to run after the build and before the
      # artifact goes anywhere. Fails the release rather than shipping markup
      # that points at files which are not there.
      - name: Verify Markup Assets
        run: yarn verify:markup
      # And that the pages the markup links to were built. An asset that is
      # missing is a broken image; a page that is missing is a link the site
      # itself offers and the host answers with a 404.
      - name: Verify Internal Links
        run: yarn verify:links
      # Same reasoning: the markdown twins only exist once the exporter has run,
      # and a page that loses its twin is invisible from the site itself.
      - name: Verify Markdown
        run: yarn verify:markdown
      # No build output involved: this is the edge Worker's negotiation logic,
      # which decides whether a request gets HTML or markdown. A false positive
      # would serve plain text to a browser, so it gates the release too.
      - name: Test Worker
        run: yarn worker:test
      - name: Archive Production Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: out
          # Without this the upload silently drops every dotfile and
          # dot-directory, which means out/.well-known never reaches the deploy
          # job. The build succeeds, every verify step passes, Firebase deploys,
          # and the agent-skills documents 404 in production with nothing in the
          # logs but a warning.
          include-hidden-files: true
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # The deploy secrets belong to this environment rather than to the
    # repository, so only a job that names it can read them, and the
    # environment's own rules (allowed tags, an approval) decide when that is.
    # Configured under Settings -> Environments. If it does not exist yet,
    # GitHub creates it on the first run with no rules, and repository-level
    # secrets keep working, so this line is safe before the setup is done.
    environment:
      name: production
      url: https://www.dehlimusikk.no/
    # One deploy at a time. Without it two releases close together could finish
    # in the wrong order and leave the older build live. GitHub keeps at most
    # one run waiting and replaces it with any newer one, so the newest release
    # is always the last to deploy. A running deploy is never cancelled: a
    # half-finished Firebase deploy is worse than a late one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Each secret is handed only to the step that uses it, never set at job
    # level. A job-level env is visible to every step, including third-party
    # code, which is exactly what a deploy token must not be.
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # wrangler needs Node 22 or later. Set explicitly rather than trusting
      # whichever Node the runner image ships.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Download Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: out
      # The verify steps all run in the build job, so nothing has ever checked
      # what actually survived the artifact round trip. That is precisely how the
      # .well-known directory went missing from a release that passed every gate.
      - name: Verify Artifact Is Complete
        run: |
          missing=0
          for file in index.html robots.txt .well-known/agent-skills/index.json; do
            if [ ! -f "out/$file" ]; then echo "missing from artifact: $file"; missing=1; fi
          done
          [ "$missing" = 0 ] || { echo "Refusing to deploy an incomplete artifact."; exit 1; }
          echo "artifact complete"
      # Both deploy CLIs come from deploy/package-lock.json, which fixes every
      # package in their trees and its integrity hash. npx pinned only the top
      # level, so each release resolved firebase-tools' 650-odd dependencies
      # afresh in the one job that holds the deploy tokens. --ignore-scripts
      # because nothing in that tree needs an install script to run, and a
      # compromised package most often strikes through one. See deploy/README.md.
      #
      # No secret is in reach of this step or the next.
      - name: Install Deploy Tools
        working-directory: deploy
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Checks every installed package against the npm registry's signatures,
      # and its provenance attestation where it has one. A tarball that was
      # altered after publishing fails here, before any token is handed out.
      - name: Verify Deploy Tool Signatures
        working-directory: deploy
        run: npm audit signatures
      # The official CLI, rather than w9jds/firebase-action. That action was
      # referenced by branch (@master), so whatever its owner pushed would have
      # run here with the deploy token.
      - name: Deploy to Firebase
        run: deploy/node_modules/.bin/firebase deploy --only hosting --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      # After hosting, so the URLs submitted are already live. Reads the markdown
      # twins in the downloaded artifact for their published/modified dates and
      # submits only what this release changed.
      #
      # continue-on-error because the site is deployed and correct by this point:
      # a refused submission costs a crawl hint, not a release, and marking the
      # release failed over it would be misleading. Bing finds the pages anyway.
      - name: Submit Changed URLs to IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs
      # Deploys after hosting, so the markdown files the Worker serves are
      # already in place. Skipped when no Cloudflare token is configured: the
      # Worker is an enhancement, and a missing secret should not fail a release
      # that has already shipped the site.
      #
      # Run directly rather than through cloudflare/wrangler-action, which infers
      # a package manager from the lockfile: it picked yarn, and the global yarn
      # on the runner is 1.22 while this repo declares yarn 4 via packageManager,
      # so it refused to run without Corepack. That action also defaulted to
      # wrangler 3.90, which is older than wrangler.jsonc support and cannot read
      # this Worker's config at all. The version now comes from
      # deploy/package-lock.json, like firebase-tools above.
      #
      # An `if` cannot read a secret, so this step reports only whether the token
      # exists, and the token itself reaches the deploy step alone.
      - name: Check For Cloudflare Token
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "configured=$([ -n "$CLOUDFLARE_API_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # wrangler reads CLOUDFLARE_API_TOKEN from the environment.
      - name: Deploy Markdown Negotiation Worker
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: deploy/node_modules/.bin/wrangler deploy --config worker/wrangler.jsonc
