name: Build and Deploy
permissions:
  contents: read

on:
  release:
    types: [created]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies
        run: yarn install --immutable
      # Reads public/ rather than the export, so it runs before the build and
      # fails fast. Catches a SKILL.md edited without regenerating the digest in
      # the discovery index, which would otherwise ship an index telling every
      # reader the document had been tampered with.
      - name: Verify Agent Skills Index
        run: yarn verify:skills
      - name: Build
        run: yarn build
      # Reads the exported HTML, so it has to run after the build and before the
      # artifact goes anywhere. Fails the release rather than shipping markup
      # that points at files which are not there.
      - name: Verify Markup Assets
        run: yarn verify:markup
      # Same reasoning: the markdown twins only exist once the exporter has run,
      # and a page that loses its twin is invisible from the site itself.
      - name: Verify Markdown
        run: yarn verify:markdown
      # No build output involved: this is the edge Worker's negotiation logic,
      # which decides whether a request gets HTML or markdown. A false positive
      # would serve plain text to a browser, so it gates the release too.
      - name: Test Worker
        run: yarn worker:test
      - name: Archive Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: out
          # Without this the upload silently drops every dotfile and
          # dot-directory, which means out/.well-known never reaches the deploy
          # job. The build succeeds, every verify step passes, Firebase deploys,
          # and the agent-skills documents 404 in production with nothing in the
          # logs but a warning.
          include-hidden-files: true
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # At job level so the step below can test it in an `if`, which cannot read a
    # secret directly.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: out
      # The verify steps all run in the build job, so nothing has ever checked
      # what actually survived the artifact round trip. That is precisely how the
      # .well-known directory went missing from a release that passed every gate.
      - name: Verify Artifact Is Complete
        run: |
          missing=0
          for file in index.html robots.txt .well-known/agent-skills/index.json; do
            if [ ! -f "out/$file" ]; then echo "missing from artifact: $file"; missing=1; fi
          done
          [ "$missing" = 0 ] || { echo "Refusing to deploy an incomplete artifact."; exit 1; }
          echo "artifact complete"
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      # After hosting, so the URLs submitted are already live. Reads the markdown
      # twins in the downloaded artifact for their published/modified dates and
      # submits only what this release changed.
      #
      # continue-on-error because the site is deployed and correct by this point:
      # a refused submission costs a crawl hint, not a release, and marking the
      # release failed over it would be misleading. Bing finds the pages anyway.
      - name: Submit Changed URLs to IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs
      # Deploys after hosting, so the markdown files the Worker serves are
      # already in place. Skipped when no Cloudflare token is configured: the
      # Worker is an enhancement, and a missing secret should not fail a release
      # that has already shipped the site.
      #
      # Invoked through npx rather than cloudflare/wrangler-action, which infers
      # a package manager from the lockfile: it picked yarn, and the global yarn
      # on the runner is 1.22 while this repo declares yarn 4 via packageManager,
      # so it refused to run without Corepack. The major version is pinned
      # because that action also defaulted to wrangler 3.90, which is older than
      # wrangler.jsonc support and cannot read this Worker's config at all.
      # wrangler reads CLOUDFLARE_API_TOKEN from the environment.
      - name: Deploy Markdown Negotiation Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy --config worker/wrangler.jsonc
